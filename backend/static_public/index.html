<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Fantasy de Leyendas - Gestiona tu alineación histórica de leyendas del fútbol con presupuesto de 130M y simulación en tiempo real." />
  <meta name="theme-color" content="#2D6A4F" />
  <title>Fantasy de Leyendas</title>

  <!-- Google Fonts: Plus Jakarta Sans (carga asíncrona no bloqueante) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/public/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/public/icons/icon-192.png" />

  <!-- Hoja de estilos unificada y minificada (Tokens, Reset, Global, Layout y Onboarding) -->
  <link rel="stylesheet" href="/src/styles/main.min.css?v=2" />
</head>

<body class="app-body">
  <!-- Contenedor principal de la Single Page Application -->
  <div id="app-root" class="app-layout">
    <header id="app-header" class="app-header" role="banner"></header>

    <!-- Aquí es donde router.min.js inyecta el HTML de cada pantalla -->
    <main id="app-content" class="app-main" role="main" tabindex="-1"></main>

    <nav id="app-navigation" class="app-navigation" role="navigation"></nav>
  </div>

  <!-- Modal global para alertas y confirmaciones -->
  <div id="app-modal-container"></div>

  <!-- Enrutador SPA unificado y minificado (Vanilla ES Modules) -->
  <script type="module" src="/src/app/router.min.js?v=2"></script>

  <!-- Librería Lottie ligera (SVG-only) diferida para no bloquear el hilo principal -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
</body>

</html>
