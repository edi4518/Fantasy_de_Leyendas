<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Fantasy de Leyendas - Gestiona tu alineación histórica de leyendas del fútbol con presupuesto de 130M y simulación en tiempo real." />
  <meta name="theme-color" content="#2D6A4F" />
  <meta name="referrer" content="no-referrer" />
  
  <!-- Soporte Completo PWA para iOS / Safari WebApp -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fantasy Leyendas" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Fantasy de Leyendas</title>

  <!-- Favicon y PWA Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/public/icons/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="manifest" href="/public/manifest.webmanifest" />
  
  <!-- Apple Touch Icons (Raíz y Public) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />

  <!-- Estilos críticos inline para arranque instantáneo y eliminación de pantalla negra en iOS -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #1B4332;
      -webkit-tap-highlight-color: transparent;
      min-height: 100%;
    }
    #pwa-app-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #1B4332;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    }
    .splash-logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: splashFadeIn 0.4s ease-out;
    }
    .splash-logo-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25));
    }
    .splash-title {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .splash-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #52B788;
      border-radius: 50%;
      animation: splashSpin 0.8s linear infinite;
      margin-top: 6px;
    }
    @keyframes splashSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes splashFadeIn {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- Google Fonts: Plus Jakarta Sans (solo pesos indispensables 400, 600, 700 con display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Preload de módulos críticos para romper la cascada de dependencias (Modulepreload) -->
  <link rel="modulepreload" href="/src/app/main.js?v=1.3.0" />
  <link rel="modulepreload" href="/src/app/version.js?v=1.3.0" />
  <link rel="modulepreload" href="/src/app/router.js?v=1.3.0" />
  <link rel="modulepreload" href="/src/services/api-client.js?v=50" />
  <link rel="modulepreload" href="/src/screens/dashboard/dashboard.js?v=1.3.0" />

  <!-- Hoja de estilos unificada y minificada (Tokens, Reset, Global, Layout y Onboarding) -->
  <link rel="stylesheet" href="/src/styles/main.min.css?v=1.3.0" />
  <link rel="stylesheet" href="/src/styles/pwa-install.css?v=1.3.0" />
</head>

<body class="app-body">
  <!-- Pantalla de Inicio / Splash nativa para iOS y PWA (Garantiza que la pantalla de inicio cargue sin parpadeos negros) -->
  <div id="pwa-app-splash" aria-hidden="true">
    <div class="splash-logo-container">
      <img src="/public/icons/icon-192.png" alt="Fantasy de Leyendas" class="splash-logo-img" width="96" height="96" />
      <h1 class="splash-title">Fantasy de Leyendas</h1>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <!-- Contenedor principal de la Single Page Application -->
  <div id="app-root" class="app-layout">
    <header id="app-header" class="app-header" role="banner"></header>

    <!-- Aquí es donde router.min.js inyecta el HTML de cada pantalla -->
    <main id="app-content" class="app-main flex-1 overflow-y-auto" role="main" tabindex="-1"></main>

    <nav id="app-navigation" class="app-navigation" role="navigation"></nav>
  </div>

  <!-- Modal global para alertas y confirmaciones -->
  <div id="app-modal-container"></div>

  <!-- Enrutador SPA unificado y minificado (Vanilla ES Modules) -->
  <script type="module" src="/src/app/main.js?v=1.3.0"></script>
</body>

</html>
