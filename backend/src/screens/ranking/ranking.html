<section class="ranking-screen">
  <!-- Cabecera -->
  <header class="ranking-header">
    <h1 class="ranking-title">Ranking Global</h1>
    <span class="ranking-season">TEMPORADA 24 / 25</span>
  </header>

  <!-- Podio Top 3 Dinámico -->
  <div class="podium-container" id="podium-container">
    <!-- Puesto 2: Segundo lugar -->
    <div class="podium-step podium-step--second" id="podium-step-2">
      <div class="podium-card">
        <div class="podium-avatar-wrapper">
          <div class="podium-avatar" id="podium-avatar-2">
            <svg class="avatar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </div>
          <span class="podium-badge podium-badge--second">2</span>
        </div>
        <span class="podium-name" id="podium-name-2">-</span>
        <span class="podium-team-name" id="podium-team-2">-</span>
        <span class="podium-points" id="podium-points-2">- pts</span>
      </div>
    </div>

    <!-- Puesto 1: Primer lugar -->
    <div class="podium-step podium-step--first" id="podium-step-1">
      <div class="podium-crown">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5m14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"></path>
        </svg>
      </div>
      <div class="podium-card podium-card--first">
        <div class="podium-avatar-wrapper">
          <div class="podium-avatar podium-avatar--first" id="podium-avatar-1">
            <svg class="avatar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </div>
          <span class="podium-badge podium-badge--first">1</span>
        </div>
        <span class="podium-name podium-name--first" id="podium-name-1">-</span>
        <span class="podium-team-name" id="podium-team-1">-</span>
        <span class="podium-points podium-points--first" id="podium-points-1">- pts</span>
      </div>
    </div>

    <!-- Puesto 3: Tercer lugar -->
    <div class="podium-step podium-step--third" id="podium-step-3">
      <div class="podium-card">
        <div class="podium-avatar-wrapper">
          <div class="podium-avatar podium-avatar--third" id="podium-avatar-3">
            <svg class="avatar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </div>
          <span class="podium-badge podium-badge--third">3</span>
        </div>
        <span class="podium-name" id="podium-name-3">-</span>
        <span class="podium-team-name" id="podium-team-3">-</span>
        <span class="podium-points podium-points--third" id="podium-points-3">- pts</span>
      </div>
    </div>
  </div>

  <!-- Lista Clasificada Dinámica (Puestos 4 en adelante) -->
  <ul class="ranking-list" id="ranking-list"></ul>

  <!-- Contenedor Fijo Flotante del Mánager Conectado (Dock con gradiente superior) -->
  <div class="ranking-current-user-dock" id="ranking-current-user-dock">
    <div class="ranking-current-user" id="ranking-current-user">
      <div class="user-position-box">
        <span class="user-position-label">POSICIÓN</span>
        <span class="user-rank" id="user-rank-val">-</span>
      </div>
      <div class="user-avatar-badge" id="user-avatar-badge">
        <svg class="avatar-icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
            stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </div>
      <div class="user-team-info">
        <span class="user-team-title" id="user-display-name">Mi Equipo</span>
        <span class="user-team" id="user-team-name">-</span>
      </div>
      <div class="user-points-badge">
        <span class="user-points" id="user-points-val">1.000 pts</span>
        <span class="user-points-trend" id="user-points-trend">-</span>
      </div>
    </div>
  </div>
</section>
