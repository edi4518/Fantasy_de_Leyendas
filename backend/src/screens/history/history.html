<link rel="stylesheet" href="/src/styles/screens/history.css?v=16">
<section class="history-screen history-app-container" id="history-view">
  <!-- 1. ENCABEZADO DE LA VISTA -->
  <header class="history-header" role="banner">
    <span class="history-header__overline">REGISTRO DE TEMPORADA</span>
    <h1 class="history-header__title">Historial de Partidos</h1>
    <p class="history-header__subtitle" id="history-subtitle">Mostrando los últimos 10 resultados</p>
  </header>

  <!-- 2. LISTADO DE TARJETAS DE PARTIDOS -->
  <main class="history-main" role="main">
    <div class="history-cards-list" id="history-cards-container" role="feed" aria-label="Historial de enfrentamientos disputados">
      <!-- Se pueblan reactivamente las tarjetas de partidos -->
    </div>
  </main>

  <!-- 3. POPUP / MODAL DE DETALLES DEL PARTIDO -->
  <div class="history-modal-backdrop" id="history-details-modal" role="dialog" aria-modal="true" aria-labelledby="history-modal-title" hidden aria-hidden="true">
    <div class="history-modal-dialog">
      <!-- Encabezado del Modal -->
      <header class="history-modal-header">
        <h2 class="history-modal-title" id="history-modal-title">Detalles del Partido</h2>
        <button type="button" class="history-modal-close" id="btn-close-history-modal" aria-label="Cerrar ventana">
          <span aria-hidden="true">&times;</span>
        </button>
      </header>

      <!-- Cuerpo del Modal -->
      <div class="history-modal-body">
        <!-- Marcador Central -->
        <div class="history-modal-scoreboard" data-purpose="scoreboard">
          <div class="history-modal-team history-modal-team--home">
            <span class="history-modal-team-name" id="history-modal-home-name">Tu Equipo</span>
          </div>
          <div class="history-modal-score">
            <span class="history-modal-score-num" id="history-modal-home-score">2</span>
            <span class="history-modal-score-sep">-</span>
            <span class="history-modal-score-num" id="history-modal-away-score">1</span>
          </div>
          <div class="history-modal-team history-modal-team--away">
            <span class="history-modal-team-name" id="history-modal-away-name">Real Galácticos</span>
          </div>
        </div>

        <!-- Cronología del Partido -->
        <div class="history-modal-events" data-purpose="match-events-list">
          <div class="history-modal-events-header">
            <h3 class="history-modal-events-title">Cronología del Partido</h3>
            <div class="history-modal-legend">
              <span class="history-modal-legend-item">
                <span class="history-modal-legend-dot history-modal-legend-dot--home"></span>
                <span id="history-modal-legend-home">Tu Equipo</span>
              </span>
              <span class="history-modal-legend-item">
                <span class="history-modal-legend-dot history-modal-legend-dot--away"></span>
                <span>Rival</span>
              </span>
            </div>
          </div>

          <div class="history-modal-timeline" id="history-modal-timeline">
            <!-- Renderizado dinámico desde history.js -->
          </div>
        </div>

        <!-- Puntos Obtenidos -->
        <div class="history-modal-points-card" data-purpose="points-earned-card">
          <span class="history-modal-points-label">Puntos Obtenidos</span>
          <span class="history-modal-points-value history-modal-points-value--win" id="history-modal-points">+25 Puntos</span>
        </div>
      </div>
    </div>
  </div>
</section>
<script type="module" src="/src/screens/history/history.js?v=16"></script>
