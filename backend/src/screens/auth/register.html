<div class="login-card register-card" id="register-container">
  <!-- BEGIN: TopHeaderSection -->
  <header class="register-top-bar">
    <!-- Back Navigation Button -->
    <a href="/login" data-link class="back-link-btn" id="reg-back-btn" aria-label="Volver atrás">
      <svg class="back-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15.75 19.5L8.25 12l7.5-7.5"></path>
      </svg>
    </a>

    <!-- Brand Isotype & Name -->
    <div class="top-trophy-wrapper">
      <div class="trophy-badge" aria-hidden="true">
        <svg class="trophy-svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.504-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.004-9.375V4.5a1.5 1.5 0 00-1.5-1.5h-2a1.5 1.5 0 00-1.5 1.5v1.875M4.5 7.5h15M6 7.5v4.125a6 6 0 006 6v0a6 6 0 006-6V7.5"></path>
        </svg>
      </div>
      <span class="app-subname">Fantasy de Leyendas</span>
    </div>
  </header>
  <!-- END: TopHeaderSection -->

  <!-- BEGIN: TitleAndIntro -->
  <div class="register-header-text">
    <span class="role-badge">NUEVO MÁNAGER</span>
    <h1 class="register-title">Crear Cuenta</h1>
  </div>
  <!-- END: TitleAndIntro -->

  <!-- BEGIN: ProfilePhotoSelector -->
  <div class="avatar-picker-section" data-purpose="profile-photo-picker">
    <div class="avatar-container">
      <!-- Main Circular Avatar Container -->
      <div class="avatar-circle" id="avatar-preview">
        <svg class="avatar-placeholder-svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
        </svg>
      </div>
      <!-- Floating Camera Badge Button -->
      <label for="profile-picture-input" class="camera-badge">
        <span class="visually-hidden">Subir foto de perfil</span>
        <svg class="camera-svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"></path>
          <path d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"></path>
        </svg>
      </label>
      <input type="file" id="profile-picture-input" name="profile_picture" accept="image/*" class="visually-hidden" />
    </div>
    <span class="avatar-label">Foto de perfil (Opcional)</span>
  </div>
  <!-- END: ProfilePhotoSelector -->

  <!-- BEGIN: RegistrationForm -->
  <form id="register-form" class="login-form register-form-body" novalidate data-purpose="registration-form">
    <!-- Nombre y Apellidos (Fila de 2 columnas) -->
    <div class="form-row">
      <!-- Nombre -->
      <div class="form-group flex-1">
        <label for="reg-first-name" class="form-label">Nombre</label>
        <div class="input-wrapper clean-wrapper" id="reg-name-wrapper">
          <input type="text" id="reg-first-name" name="first_name" class="form-input" placeholder="Nombre" required autocomplete="given-name" />
        </div>
      </div>

      <!-- Apellidos -->
      <div class="form-group flex-1">
        <label for="reg-last-name" class="form-label">Apellidos</label>
        <div class="input-wrapper clean-wrapper" id="reg-lastname-wrapper">
          <input type="text" id="reg-last-name" name="last_name" class="form-input" placeholder="Apellidos" required autocomplete="family-name" />
        </div>
      </div>
    </div>

    <!-- Nombre del equipo -->
    <div class="form-group">
      <label for="reg-team-name" class="form-label">Nombre del equipo</label>
      <div class="input-wrapper clean-wrapper" id="reg-team-wrapper">
        <input type="text" id="reg-team-name" name="team_name" class="form-input" placeholder="Introduce el nombre de tu equipo" required />
      </div>
    </div>

    <!-- Fecha de nacimiento -->
    <div class="form-group">
      <label for="reg-birthdate" class="form-label">Fecha de nacimiento</label>
      <div class="input-wrapper has-right-icon" id="reg-birthdate-wrapper">
        <input type="text" id="reg-birthdate" name="birthdate" class="form-input" placeholder="DD / MM / AAAA" required />
        <div class="input-right-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.75 3v2.25M17.25 3v2.253M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Correo electrónico -->
    <div class="form-group">
      <label for="reg-email" class="form-label">Correo electrónico</label>
      <div class="input-wrapper has-right-icon" id="reg-email-wrapper">
        <input type="email" id="reg-email" name="email" class="form-input" placeholder="tu@ejemplo.com" required autocomplete="email" />
        <div class="input-right-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Contraseña -->
    <div class="form-group">
      <label for="reg-password" class="form-label">Contraseña</label>
      <div class="input-wrapper has-right-icon" id="reg-password-wrapper">
        <input type="password" id="reg-password" name="password" class="form-input" placeholder="Crea una contraseña segura" required autocomplete="new-password" />
        <button type="button" id="reg-toggle-password-btn" class="toggle-password-btn" aria-label="Mostrar contraseña" aria-pressed="false">
          <img src="/src/assets/icons/eye-open.svg" alt="" aria-hidden="true" class="eye-icon" width="20" height="20" id="reg-eye-icon-img" />
        </button>
      </div>
    </div>

    <!-- Mensaje de error dinámico -->
    <p id="reg-error-message" class="error-message hidden" role="alert" aria-live="polite"></p>

    <!-- Main Call To Action Button -->
    <div class="submit-btn-wrap">
      <button type="submit" class="submit-btn" id="reg-submit-btn">
        CREAR CUENTA
      </button>
    </div>
  </form>
  <!-- END: RegistrationForm -->

  <!-- BEGIN: FooterRedirect -->
  <footer class="login-footer">
    <p class="signup-prompt">
      ¿Ya tienes una cuenta? <a href="/login" data-link class="signup-link">Iniciar sesión</a>
    </p>
  </footer>
  <!-- END: FooterRedirect -->
</div>
