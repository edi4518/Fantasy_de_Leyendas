<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Fantasy de Leyendas - Gestiona tu alineación histórica de leyendas del fútbol con presupuesto de 130M y simulación en tiempo real." />
  <meta name="theme-color" content="#2D6A4F" />
  <title>Fantasy de Leyendas</title>

  <!-- Favicon y PWA Icons -->
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="manifest" href="/public/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/public/icons/icon-192.png" />

  <!-- Google Fonts: Plus Jakarta Sans (solo pesos indispensables 400, 600, 700 con display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Preload de módulos críticos para romper la cascada de dependencias (Modulepreload) -->
  <link rel="modulepreload" href="/src/app/main.js" />
  <link rel="modulepreload" href="/src/app/router.js" />
  <link rel="modulepreload" href="/src/services/api-client.js" />
  <link rel="modulepreload" href="/src/screens/dashboard/dashboard.js" />

  <!-- Hoja de estilos unificada y minificada (Tokens, Reset, Global, Layout y Onboarding) -->
  <link rel="stylesheet" href="/src/styles/main.min.css?v=8" />
</head>

<body class="app-body">
  <!-- Contenedor principal de la Single Page Application -->
  <div id="app-root" class="app-layout">
    <header id="app-header" class="app-header" role="banner"></header>

    <!-- Aquí es donde router.min.js inyecta el HTML de cada pantalla -->
    <main id="app-content" class="app-main flex-1 overflow-y-auto" role="main" tabindex="-1"></main>

    <nav id="app-navigation" class="app-navigation" role="navigation"></nav>
  </div>

  <!-- Modal global para alertas y confirmaciones -->
  <div id="app-modal-container"></div>

  <!-- Enrutador SPA unificado y minificado (Vanilla ES Modules) -->
  <script type="module" src="/src/app/main.js"></script>
</body>

</html>
