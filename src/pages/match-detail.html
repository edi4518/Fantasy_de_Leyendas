<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Fantasy de Leyendas - Detalles y Simulación de Partido en Directo. Estadísticas, cronología y eventos minuto a minuto.">
  <meta name="theme-color" content="#2D6A4F">
  <title>Partido en Directo | Fantasy de Leyendas</title>

  <!-- Tipografía Oficial: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Base del Sistema de Diseño -->
  <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/components.css">

  <!-- Estilos Específicos de la Vista de Detalle de Partido y Componentes -->
  <link rel="stylesheet" href="../styles/views/match-detail.css">
  <link rel="stylesheet" href="../styles/components/modal.css">
</head>
<body class="match-detail-body">
  <!-- Contenedor Principal (Mobile-First Shell) -->
  <div class="match-detail-container" id="match-view">

    <!-- 1. HEADER SUPERIOR CON ACCIÓN DE SIMULACIÓN EN VIVO Y RÁPIDA -->
    <header class="match-header" role="banner">
      <div class="match-header__left">
        <a href="home.html" class="match-header__back-btn" id="btn-back" aria-label="Volver a la pantalla de inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <h1 class="match-header__title">Partido en Directo</h1>
      </div>

      <div class="match-header__actions">
        <button type="button" class="btn btn-live-sim" id="btn-live-sim" aria-label="Simular minuto a minuto en directo" title="Iniciar relato en directo">
          ▶ EN VIVO
        </button>
        <button type="button" class="btn btn--primary btn-quick-sim" id="btn-quick-sim" aria-label="Ejecutar simulación rápida del partido">
          SIMULACIÓN RÁPIDA
        </button>
      </div>
    </header>

    <!-- 2. MARCADOR PRINCIPAL (Equipos y Resultado) -->
    <section class="match-scoreboard" aria-label="Marcador del partido">
      <div class="team-side team-side--home">
        <span class="team-side__name" id="home-team-name">Tu Equipo</span>
      </div>

      <div class="scoreboard-center">
        <div class="scoreboard-score" id="scoreboard-score-container" aria-label="Marcador">
          <span class="score-number" id="home-score">2</span>
          <span class="score-divider">–</span>
          <span class="score-number" id="away-score">1</span>
        </div>

        <div class="match-status-badge" id="match-status-badge" role="button" tabindex="0" title="Click para simular o pausar" aria-label="Estado del partido">
          <span class="status-indicator-dot" id="status-dot" aria-hidden="true"></span>
          <span class="status-text" id="match-status-text">FINAL</span>
        </div>
      </div>

      <div class="team-side team-side--away">
        <span class="team-side__name" id="away-team-name">Equipo Rival</span>
      </div>
    </section>

    <!-- 3. CANCHA TÁCTICA ILUSTRADA CON OVERLAY DE JUGADA EN DIRECTO -->
    <section class="match-pitch-section" aria-label="Visualización táctica del partido">
      <div class="tactical-pitch">
        <!-- Líneas Oficiales de la Cancha de Fútbol -->
        <div class="pitch-marking pitch-marking--boundary"></div>
        <div class="pitch-marking pitch-marking--halfway"></div>
        <div class="pitch-marking pitch-marking--center-circle"></div>
        <div class="pitch-marking pitch-marking--center-spot"></div>
        <div class="pitch-marking pitch-marking--penalty-box-top"></div>
        <div class="pitch-marking pitch-marking--goal-box-top"></div>
        <div class="pitch-marking pitch-marking--penalty-box-bottom"></div>
        <div class="pitch-marking pitch-marking--goal-box-bottom"></div>

        <!-- Banner de Evento en Directo sobre el Césped -->
        <div class="pitch-action-overlay" id="pitch-action-overlay">
          <span class="pitch-action-team" id="pitch-action-team">
            <span class="pitch-action-dot" aria-hidden="true"></span>
            <span id="pitch-action-team-text">Tu Equipo</span>
          </span>
          <span class="pitch-action-status" id="pitch-action-status">ATAQUE PELIGROSO</span>
        </div>
      </div>
    </section>

    <!-- 4. PESTAÑAS INTERNAS DE NAVEGACIÓN (Cronología / Estadísticas / Alineaciones) -->
    <nav class="match-tabs" role="tablist" aria-label="Secciones del partido">
      <button type="button" class="match-tab is-active" role="tab" id="tab-cronologia" data-target="panel-cronologia" aria-selected="true" aria-controls="panel-cronologia">
        Cronología
      </button>
      <button type="button" class="match-tab" role="tab" id="tab-estadisticas" data-target="panel-estadisticas" aria-selected="false" aria-controls="panel-estadisticas">
        Estadísticas
      </button>
      <button type="button" class="match-tab" role="tab" id="tab-alineaciones" data-target="panel-alineaciones" aria-selected="false" aria-controls="panel-alineaciones">
        Alineaciones
      </button>
    </nav>

    <!-- 5. CONTENIDO DE LAS PESTAÑAS (DATA-DRIVEN) -->
    <main class="match-tab-panels" role="main">

      <!-- PESTAÑA A: CRONOLOGÍA DE EVENTOS (TIMELINE) -->
      <section class="tab-panel is-active" id="panel-cronologia" role="tabpanel" aria-labelledby="tab-cronologia">
        <div class="timeline-container" id="timeline-events-list">
          <!-- Se inyecta dinámicamente con renderTimeline() -->
        </div>
      </section>

      <!-- PESTAÑA B: DESGLOSE ESTADÍSTICO (Barras Comparativas) -->
      <section class="tab-panel" id="panel-estadisticas" role="tabpanel" aria-labelledby="tab-estadisticas" hidden>
        <div class="stats-container" id="match-stats-list">
          <!-- Se inyecta dinámicamente con renderStats() -->
        </div>
      </section>

      <!-- PESTAÑA C: ALINEACIONES (Formato 6v6) -->
      <section class="tab-panel" id="panel-alineaciones" role="tabpanel" aria-labelledby="tab-alineaciones" hidden>
        <div class="lineups-container" id="lineups-display">
          <div class="lineup-column lineup-column--home">
            <h3 class="lineup-title" id="lineup-home-title">Tu Equipo</h3>
            <ul class="lineup-players-list" id="lineup-home-players">
              <!-- Se inyecta dinámicamente con renderLineups() -->
            </ul>
          </div>

          <div class="lineup-column lineup-column--away">
            <h3 class="lineup-title" id="lineup-away-title">Equipo Rival</h3>
            <ul class="lineup-players-list" id="lineup-away-players">
              <!-- Se inyecta dinámicamente con renderLineups() -->
            </ul>
          </div>
        </div>
      </section>

    </main>

  </div>

  <!-- Contenedor para Modales Dinámicos -->
  <div id="app-modal-container"></div>

  <!-- Controlador Modular JS -->
  <script type="module" src="../js/views/match-detail.js"></script>
</body>
</html>
