<main class="login-card register-card">
  <!-- Barra superior: Volver y Trofeo centrado -->
  <header class="register-top-bar">
    <a href="/login" data-link class="back-btn" aria-label="Volver">
      <img src="/src/assets/icons/arrow-left.svg" alt="" width="20" height="20" />
    </a>
    <div class="top-trophy-wrapper">
      <div class="trophy-badge" aria-hidden="true">
        <img src="/src/assets/icons/trophy.svg" alt="" class="trophy-icon" width="22" height="22" />
      </div>
      <span class="app-subname">Fantasy de Leyendas</span>
    </div>
  </header>

  <!-- Título principal -->
  <div class="register-header-text">
    <span class="role-badge">NUEVO MÁNAGER</span>
    <h1 class="login-title register-title">Crear Cuenta</h1>
  </div>

  <!-- Selector opcional de foto de perfil -->
  <div class="avatar-picker-section">
    <div class="avatar-container">
      <div class="avatar-circle" id="avatar-preview">
        <img src="/src/assets/icons/user-avatar.svg" alt="Avatar" width="40" height="40" />
      </div>
      <label for="profile-picture-input" class="camera-badge" aria-label="Subir foto de perfil">
        <img src="/src/assets/icons/camera.svg" alt="" width="12" height="12" />
      </label>
      <input type="file" id="profile-picture-input" name="profile_picture" accept="image/*" class="visually-hidden" />
    </div>
    <span class="avatar-label">Foto de perfil (Opcional)</span>
  </div>

  <!-- Formulario de Registro -->
  <form id="register-form" class="login-form register-form-body" novalidate>
    <!-- Nombre y Apellidos (Fila de 2 columnas) -->
    <div class="form-row">
      <div class="form-group flex-1">
        <label for="reg-first-name" class="form-label">Nombre</label>
        <div class="input-wrapper clean-wrapper" id="reg-name-wrapper">
          <input type="text" id="reg-first-name" name="first_name" class="form-input" placeholder="Nombre" required
            autocomplete="given-name" />
        </div>
      </div>

      <div class="form-group flex-1">
        <label for="reg-last-name" class="form-label">Apellidos</label>
        <div class="input-wrapper clean-wrapper" id="reg-lastname-wrapper">
          <input type="text" id="reg-last-name" name="last_name" class="form-input" placeholder="Apellidos" required
            autocomplete="family-name" />
        </div>
      </div>
    </div>

    <!-- Nombre del equipo -->
    <div class="form-group">
      <label for="reg-team-name" class="form-label">Nombre del equipo</label>
      <div class="input-wrapper clean-wrapper" id="reg-team-wrapper">
        <input type="text" id="reg-team-name" name="team_name" class="form-input"
          placeholder="Introduce el nombre de tu equipo" required />
      </div>
    </div>

    <!-- Fecha de nacimiento -->
    <div class="form-group">
      <label for="reg-birthdate" class="form-label">Fecha de nacimiento</label>
      <div class="input-wrapper" id="reg-birthdate-wrapper">
        <input type="text" id="reg-birthdate" name="birthdate" class="form-input" placeholder="DD / MM / AAAA"
          required />
        <img src="/src/assets/icons/calendar.svg" alt="" class="input-icon-right" width="18" height="18"
          aria-hidden="true" />
      </div>
    </div>

    <!-- Correo electrónico -->
    <div class="form-group">
      <label for="reg-email" class="form-label">Correo electrónico</label>
      <div class="input-wrapper" id="reg-email-wrapper">
        <input type="email" id="reg-email" name="email" class="form-input" placeholder="tu@ejemplo.com" required
          autocomplete="email" />
        <img src="/src/assets/icons/mail.svg" alt="" class="input-icon-right" width="18" height="18"
          aria-hidden="true" />
      </div>
    </div>

    <!-- Contraseña -->
    <div class="form-group">
      <label for="reg-password" class="form-label">Contraseña</label>
      <div class="input-wrapper" id="reg-password-wrapper">
        <input type="password" id="reg-password" name="password" class="form-input"
          placeholder="Crea una contraseña segura" required autocomplete="new-password" />
        <button type="button" id="reg-toggle-password-btn" class="toggle-password-btn" aria-label="Mostrar contraseña">
          <img src="/src/assets/icons/eye-open.svg" alt="" class="eye-icon" width="18" height="18"
            id="reg-eye-icon-img" />
        </button>
      </div>
    </div>

    <!-- Mensaje de error dinámico -->
    <p id="reg-error-message" class="error-message hidden" role="alert" aria-live="polite"></p>

    <!-- Botón de acción principal -->
    <button type="submit" class="submit-btn" id="reg-submit-btn">
      CREAR CUENTA
    </button>
  </form>

  <!-- Pie: Volver a inicio de sesión -->
  <footer class="login-footer">
    <p class="signup-prompt">
      ¿Ya tienes una cuenta? <a href="/login" data-link class="signup-link">Iniciar sesión</a>
    </p>
  </footer>
</main>
