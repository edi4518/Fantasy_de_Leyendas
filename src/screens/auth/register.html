<!-- Vista HTML: Formulario de registro de nuevo Director Técnico -->
<section class="screen-register auth-container">
  <h2>Crear Cuenta de Manager</h2>
  <form id="register-form">
    <div class="form-group">
      <label for="reg-username">Nombre de Manager</label>
      <input type="text" id="reg-username" required />
    </div>
    <div class="form-group">
      <label for="reg-email">Correo Electrónico</label>
      <input type="email" id="reg-email" required />
    </div>
    <div class="form-group">
      <label for="reg-password">Contraseña</label>
      <input type="password" id="reg-password" required />
    </div>
    <button type="submit" class="btn btn--primary">Fundar Club</button>
  </form>
</section>
