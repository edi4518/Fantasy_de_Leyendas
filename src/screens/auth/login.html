<div class="login-card">
  <!-- 1. Encabezado -->
  <header class="login-header">
    <div class="trophy-badge" aria-hidden="true">
      <img src="/src/assets/icons/trophy.svg" alt="" class="trophy-icon" width="28" height="28" />
    </div>
    <h1 class="login-title">Fantasy de Leyendas</h1>
  </header>

  <!-- 2. Formulario de credenciales -->
  <form id="login-form" class="login-form" novalidate>
    <div class="form-group">
      <label for="email" class="form-label">Correo electrónico</label>
      <div class="input-wrapper" id="email-wrapper">
        <img src="/src/assets/icons/mail.svg" alt="" class="input-icon" width="18" height="18" aria-hidden="true" />
        <input type="email" id="email" name="email" class="form-input" placeholder="tu@ejemplo.com" required
          autocomplete="email" />
      </div>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Contraseña</label>
      <div class="input-wrapper" id="password-wrapper">
        <img src="/src/assets/icons/lock.svg" alt="" class="input-icon" width="18" height="18" aria-hidden="true" />
        <input type="password" id="password" name="password" class="form-input" placeholder="Introduce tu contraseña"
          required autocomplete="current-password" />
        <button type="button" id="toggle-password-btn" aria-label="Mostrar contraseña" aria-pressed="false" class="toggle-password-btn">
          <img src="/src/assets/icons/eye-open.svg" alt="" class="eye-icon" width="18" height="18" id="eye-icon-img" aria-hidden="true" />
        </button>
      </div>
    </div>

    <!-- Error dinámico oculto de entrada -->
    <p id="error-message" class="error-message hidden" role="alert" aria-live="polite"></p>

    <!-- Botón de submit principal -->
    <button type="submit" class="submit-btn" id="submit-btn">
      INICIAR SESIÓN
    </button>
  </form>

  <!-- 3. Divisor -->
  <div class="divider" aria-hidden="true">
    <span class="divider-text">o</span>
  </div>

  <!-- 4. Autenticación social (espacio reservado min-height: 44px para evitar CLS de Google GSI) -->
  <div class="social-login-group">
    <div id="google-button-container" class="google-btn-container" style="min-height: 44px; width: 100%; display: flex; align-items: center;">
      <button type="button" class="social-btn" id="google-login-btn" style="width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <img src="/src/assets/icons/google-logo.svg" alt="" class="social-icon" width="18" height="18" aria-hidden="true" />
        <span>Continuar con Google</span>
      </button>
    </div>

    <button type="button" class="social-btn guest-btn" id="guest-login-btn" style="border: 1.5px dashed #2D6A4F; background-color: #ECFDF5; color: #2D6A4F; font-weight: 700; margin-top: 6px; min-height: 44px;">
      <span style="font-size: 16px;" aria-hidden="true">⚽</span>
      <span>Entrar a la Home (Modo Prueba)</span>
    </button>
  </div>

  <!-- 5. Pie de página -->
  <footer class="login-footer">
    <p class="signup-prompt">
      ¿No tienes una cuenta? <a href="/register" data-link class="signup-link">Regístrate</a>
    </p>
  </footer>

  <!-- Modal de Bienvenida para nuevo Mánager de Google (Elección de Equipo) -->
  <div id="google-team-modal" class="modal-overlay hidden" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 99999; padding: 16px;">
    <div class="modal-card" style="background: #ffffff; border-radius: 24px; max-width: 360px; width: 100%; padding: 24px 20px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid #E2E8F0;">
      <div id="google-avatar-wrapper" style="width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px; border: 3px solid #2D6A4F; overflow: hidden; background: #ECFDF5; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <img id="google-modal-avatar" src="" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; display: none;" />
        <span id="google-modal-avatar-fallback" style="font-size: 28px;">🛡️</span>
      </div>
      <h3 id="google-welcome-title" style="font-size: 1.15rem; font-weight: 800; color: #0F172A; margin: 0 0 6px;">¡Bienvenido, Mánager!</h3>
      <p style="font-size: 0.82rem; color: #64748B; margin: 0 0 16px; line-height: 1.4;">
        Para recibir tus <strong>150.0M</strong> de presupuesto y comenzar a fichar leyendas, asignale un nombre a tu club:
      </p>
      <div style="margin-bottom: 12px; text-align: left;">
        <label for="google-team-name-input" style="font-size: 0.75rem; font-weight: 800; color: #334155; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px;">Nombre del Club</label>
        <input type="text" id="google-team-name-input" placeholder="Ej: Rayo Leyendas FC" maxlength="30" style="width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid #CBD5E1; font-size: 0.92rem; font-weight: 600; outline: none; box-sizing: border-box; transition: border-color 0.2s;" />
      </div>

      <div style="margin-bottom: 16px; text-align: left;">
        <label for="google-birthdate-input" style="font-size: 0.75rem; font-weight: 800; color: #334155; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px;">Fecha de Nacimiento</label>
        <input type="text" id="google-birthdate-input" placeholder="DD / MM / AAAA" maxlength="14" style="width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid #CBD5E1; font-size: 0.92rem; font-weight: 600; outline: none; box-sizing: border-box; transition: border-color 0.2s;" />
        <p id="google-modal-error" style="color: #DC2626; font-size: 0.75rem; font-weight: 600; margin: 6px 0 0; display: none;"></p>
      </div>
      <button type="button" id="google-team-submit-btn" style="width: 100%; background: #2D6A4F; color: #ffffff; font-weight: 800; font-size: 0.88rem; padding: 12px; border-radius: 12px; border: none; cursor: pointer; transition: background-color 0.2s; box-shadow: 0 4px 6px -1px rgba(45, 106, 79, 0.25);">
        ¡CREAR CLUB Y EMPEZAR!
      </button>
    </div>
  </div>
</div>
