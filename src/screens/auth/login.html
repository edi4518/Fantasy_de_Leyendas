<main class="login-card">
  <!-- 1. Encabezado -->
  <header class="login-header">
    <div class="trophy-badge" aria-hidden="true">
      <img src="/src/assets/icons/trophy.svg" alt="" class="trophy-icon" width="28" height="28" />
    </div>
    <h1 class="login-title">Fantasy de Leyendas</h1>
  </header>

  <!-- 2. Formulario de credenciales -->
  <form id="login-form" class="login-form" novalidate>
    <div class="form-group">
      <label for="email" class="form-label">Correo electrónico</label>
      <div class="input-wrapper" id="email-wrapper">
        <img src="/src/assets/icons/mail.svg" alt="" class="input-icon" width="18" height="18" aria-hidden="true" />
        <input type="email" id="email" name="email" class="form-input" placeholder="tu@ejemplo.com" required
          autocomplete="email" />
      </div>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Contraseña</label>
      <div class="input-wrapper" id="password-wrapper">
        <img src="/src/assets/icons/lock.svg" alt="" class="input-icon" width="18" height="18" aria-hidden="true" />
        <input type="password" id="password" name="password" class="form-input" placeholder="Introduce tu contraseña"
          required autocomplete="current-password" />
        <button type="button" id="toggle-password-btn" class="toggle-password-btn" aria-label="Mostrar contraseña">
          <img src="/src/assets/icons/eye-open.svg" alt="" class="eye-icon" width="18" height="18" id="eye-icon-img" />
        </button>
      </div>
    </div>

    <!-- Error dinámico oculto de entrada -->
    <p id="error-message" class="error-message hidden" role="alert" aria-live="polite"></p>

    <!-- Botón de submit principal -->
    <button type="submit" class="submit-btn" id="submit-btn">
      INICIAR SESIÓN
    </button>
  </form>

  <!-- 3. Divisor -->
  <div class="divider" aria-hidden="true">
    <span class="divider-text">o</span>
  </div>

  <!-- 4. Autenticación social -->
  <div class="social-login-group">
    <button type="button" class="social-btn" id="google-login-btn">
      <img src="/src/assets/icons/google-logo.svg" alt="" class="social-icon" width="18" height="18" />
      <span>Continuar con Google</span>
    </button>

    <button type="button" class="social-btn" id="apple-login-btn">
      <img src="/src/assets/icons/apple-logo.svg" alt="" class="social-icon" width="18" height="18" />
      <span>Continuar con Apple</span>
    </button>
  </div>

  <!-- 5. Pie de página -->
  <footer class="login-footer">
    <p class="signup-prompt">
      ¿No tienes una cuenta? <a href="/register" data-link class="signup-link">Regístrate</a>
    </p>
  </footer>
</main>
