<!-- Vista HTML: Pizarra táctica y alineación de 11 jugadores -->
<section class="screen-lineup">
  <header class="lineup-header">
    <h2>Mi Alineación Táctica</h2>
    <select id="formation-select" class="formation-selector">
      <option value="4-3-3">4-3-3</option>
      <option value="4-4-2">4-4-2</option>
      <option value="3-5-2">3-5-2</option>
    </select>
  </header>
  <div id="tactical-pitch" class="pitch-container">
    <!-- 11 slots interactivos posicionados sobre el césped -->
  </div>
  <footer class="lineup-footer">
    <div id="lineup-penalty-summary" class="penalty-alert"></div>
    <button id="btn-save-lineup" class="btn btn--primary">Confirmar Equipo</button>
  </footer>
</section>
