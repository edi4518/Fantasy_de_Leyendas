<link rel="stylesheet" href="/src/styles/screens/comparison.css?v=230">
<div class="comparison-screen" data-purpose="comparison-screen-container">
  <!-- BEGIN: Sticky Top Section (Cabecera y Tarjetas de Jugadores Fijas sobre el Gráfico) -->
  <div class="comp-sticky-top" data-purpose="comparison-sticky-top">
    <!-- Header -->
    <header class="comp-header" data-purpose="comparison-header">
      <div class="comp-header-top">
        <button id="btn-back-to-market" type="button" class="comp-btn-icon" aria-label="Volver al mercado">
          ‹
        </button>
        <div class="comp-title-group">
          <h1 class="comp-title">Comparativa de Jugadores</h1>
          <span class="comp-badge-sim">SIMULACIÓN COMPARATIVA</span>
        </div>
      </div>

      <div class="comp-bar-info">
        <div class="comp-count-group">
          <span class="comp-dot-indicator"></span>
          <span><strong id="comp-player-count">0</strong> JUGADORES COMPARADOS</span>
        </div>
        <button id="btn-add-more-players" type="button" class="comp-btn-add">
          + Añadir
        </button>
      </div>

      <!-- Barra multicolor proporcional -->
      <div id="comp-color-bar" class="comp-color-bar"></div>
    </header>

    <!-- Carrusel horizontal de tarjetas de jugadores -->
    <section id="comp-cards-scroll" class="comp-cards-scroll" aria-label="Jugadores comparados"></section>
  </div>
  <!-- END: Sticky Top Section -->

  <!-- BEGIN: MainContent (Área de Gráfico Hexagonal y Benchmarks que scrolea libremente por debajo) -->
  <main class="comp-content" data-purpose="comparison-content">
    <!-- Perfil Táctico (Radar Chart.js) -->
    <section class="comp-section-card" data-purpose="radar-section">
      <div class="comp-section-header">
        <span>[PERFIL TÁCTICO]</span>
        <span class="comp-section-sub">MULTI-JUGADOR</span>
      </div>

      <div class="comp-radar-container">
        <canvas id="radarChart"></canvas>
      </div>

      <div id="radar-legend" class="comp-radar-legend"></div>
    </section>

    <!-- Benchmark Estadístico Dinámico -->
    <section class="comp-section-card" data-purpose="benchmark-section">
      <div class="comp-section-header">
        <span id="benchmark-title-label">[BENCHMARK ESTADÍSTICO]</span>
        <span class="comp-metric-badge">5 MÉTRICAS</span>
      </div>

      <div id="benchmark-list" class="comp-benchmark-list"></div>
    </section>
  </main>
  <!-- END: MainContent -->

  <!-- BEGIN: Modal Añadir Jugador -->
  <div id="add-player-modal" class="comp-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="comp-modal-title" hidden>
    <div class="comp-modal-sheet">
      <div class="comp-modal__handle-wrapper">
        <span class="comp-modal__handle"></span>
      </div>

      <header class="comp-modal-header">
        <div class="comp-modal-title-box">
          <h2 id="comp-modal-title" class="comp-modal-title">Añadir Jugador</h2>
          <p class="comp-modal-subtitle">Selecciona una leyenda para comparar estadísticas</p>
        </div>
        <button id="btn-close-modal" type="button" class="comp-modal-close" aria-label="Cerrar modal">
          <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <div class="comp-modal-controls">
        <div class="comp-modal-search-box">
          <span class="comp-modal-search-icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" x2="16.65" y1="21" y2="16.65"></line>
            </svg>
          </span>
          <input
            type="text"
            id="modal-search"
            class="comp-modal-search-input"
            placeholder="Buscar futbolistas..."
          />
        </div>

        <nav id="modal-filters" class="comp-modal-filters" aria-label="Filtrar por posición">
          <button type="button" class="modal-filter-btn active" data-pos="TODOS">Todos</button>
          <button type="button" class="modal-filter-btn" data-pos="POR">POR</button>
          <button type="button" class="modal-filter-btn" data-pos="DEF">DEF</button>
          <button type="button" class="modal-filter-btn" data-pos="MC">MC</button>
          <button type="button" class="modal-filter-btn" data-pos="DEL">DEL</button>
        </nav>

        <div class="comp-modal-sort-row">
          <button type="button" id="sort-name-btn" class="comp-sort-btn is-active">
            <svg class="comp-sort-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M3 6h18M3 12h12M3 18h6"></path>
            </svg>
            <span>Nombre (A-Z)</span>
          </button>
          <button type="button" id="sort-price-btn" class="comp-sort-btn">
            <svg class="comp-sort-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M7 15l5 5 5-5"></path>
              <path d="M7 9l5-5 5 5"></path>
            </svg>
            <span>Por Precio</span>
          </button>
        </div>
      </div>

      <div id="modal-player-list" class="comp-modal-player-list"></div>
    </div>
  </div>
  <!-- END: Modal Añadir Jugador -->
</div>
