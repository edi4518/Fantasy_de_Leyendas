<section class="profile-screen profile-app-container" id="profile-view">
  <!-- 1. HEADER SUPERIOR CON ACCIONES -->
  <header class="profile-header" role="banner">
    <a href="/dashboard" data-link class="profile-header__back-btn" id="btn-back" aria-label="Volver a la pantalla principal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </a>

    <h1 class="profile-header__title">Editar Perfil</h1>

    <button type="submit" form="profile-form" class="profile-header__save-btn" id="btn-header-save">
      Guardar
    </button>
  </header>

  <!-- 2. FORMULARIO PRINCIPAL DE PERFIL -->
  <main class="profile-main" role="main">
    <form class="profile-form" id="profile-form" novalidate>

      <!-- AVATAR CIRCULAR CON BOTÓN FLOTANTE DE CÁMARA -->
      <section class="avatar-section" aria-label="Foto de perfil del mánager">
        <div class="avatar-uploader">
          <div class="avatar-circle" id="profile-avatar-display" aria-label="Avatar actual">
            <svg class="avatar-silhouette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>

          <!-- Botón flotante verde con icono de cámara -->
          <button type="button" class="avatar-camera-btn" id="btn-change-avatar" aria-label="Subir nueva foto de perfil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </button>

          <!-- Input invisible para selección de archivo de imagen -->
          <input type="file" id="avatar-file-input" accept="image/*" class="visually-hidden" aria-hidden="true">
        </div>
      </section>

      <!-- SECCIÓN: INFORMACIÓN PERSONAL -->
      <fieldset class="form-section">
        <legend class="section-title">INFORMACIÓN PERSONAL</legend>

        <!-- Fila de 2 Columnas: Nombre y Apellidos -->
        <div class="form-row-2">
          <div class="form-group">
            <label for="profile-first-name" class="form-label">Nombre</label>
            <input type="text" id="profile-first-name" name="firstName" class="form-input" value="Mánager" autocomplete="given-name" required>
          </div>

          <div class="form-group">
            <label for="profile-last-name" class="form-label">Apellidos</label>
            <input type="text" id="profile-last-name" name="lastName" class="form-input" value="Nombre" autocomplete="family-name">
          </div>
        </div>

        <!-- Nombre de Mánager / Equipo -->
        <div class="form-group">
          <label for="profile-team-name" class="form-label">Nombre de Mánager / Equipo</label>
          <input type="text" id="profile-team-name" name="teamName" class="form-input" value="Mi Equipo" required>
        </div>

        <!-- Correo Electrónico (Deshabilitado con icono de candado) -->
        <div class="form-group">
          <label for="profile-email" class="form-label">Correo electrónico</label>
          <div class="input-with-icon">
            <input type="email" id="profile-email" name="email" class="form-input form-input--disabled" value="manager@ejemplo.com" disabled readonly aria-describedby="email-locked-desc">
            <span class="input-lock-icon" id="email-locked-desc" title="El correo no se puede modificar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
          </div>
        </div>
      </fieldset>

      <!-- SECCIÓN: PREFERENCIAS (Toggles / Switches) -->
      <fieldset class="form-section preferences-section">
        <legend class="section-title">PREFERENCIAS</legend>

        <!-- Toggle 1: Notificaciones de partidos (Activo) -->
        <div class="preference-item">
          <div class="preference-info">
            <span class="preference-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
            </span>
            <span class="preference-label" id="label-notifications">Notificaciones de partidos</span>
          </div>

          <label class="switch" aria-labelledby="label-notifications">
            <input type="checkbox" id="pref-notifications" name="notifications" checked>
            <span class="slider" aria-hidden="true"></span>
          </label>
        </div>

        <!-- Toggle 2: Sonidos de simulación (Inactivo) -->
        <div class="preference-item">
          <div class="preference-info">
            <span class="preference-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </span>
            <span class="preference-label" id="label-sounds">Sonidos de simulación</span>
          </div>

          <label class="switch" aria-labelledby="label-sounds">
            <input type="checkbox" id="pref-sounds" name="sounds">
            <span class="slider" aria-hidden="true"></span>
          </label>
        </div>
      </fieldset>

      <!-- ACCIONES: BOTÓN GUARDAR Y CERRAR SESIÓN -->
      <div class="form-actions">
        <button type="submit" class="btn btn--primary btn-save-profile" id="btn-save-profile">
          GUARDAR CAMBIOS
        </button>

        <button type="button" class="btn-logout" id="btn-logout" aria-label="Cerrar sesión actual">
          <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>

    </form>
  </main>

  <!-- TOAST DE NOTIFICACIÓN DE ÉXITO O ERROR -->
  <div class="profile-toast" id="profile-toast" role="status" aria-live="polite" hidden>
    <span class="toast-message" id="toast-message">Cambios guardados correctamente</span>
  </div>
</section>
